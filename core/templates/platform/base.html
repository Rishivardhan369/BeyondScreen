{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}BeyondScreen{% endblock %}</title><link rel="stylesheet" href="{% static 'css/platform.css' %}"></head><body><a class="skip" href="#content">Skip to content</a><header class="topbar"><a class="brand" href="{% url 'core:dashboard' %}">BeyondScreen</a><nav aria-label="Product"><a href="{% url 'core:summary' %}">New summary</a><a href="{% url 'core:insights' %}">Insights</a><a href="{% url 'core:weekly_review' %}">Weekly</a><a href="{% url 'core:monthly_review' %}">Monthly</a><a href="{% url 'core:notifications' %}">Notifications</a><a href="{% url 'core:profile' %}">Profile</a></nav></header><main id="content" class="shell">{% if messages %}<div class="messages" aria-live="polite">{% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main></body></html>
