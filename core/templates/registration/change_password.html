{% extends "base.html" %}

{% block title %}Change Password - BeyondScreen{% endblock %}

{% block content %}
<main>
    <section class="hero-shell auth-hero-shell">
        <div class="hero-grid">
            <div class="hero-copy reveal">
                <p class="eyebrow">Change your password</p>
                <h1>Change password</h1>
                <p class="hero-lede">Enter your new password below.</p>
            </div>
        </div>
    </section>

    <section class="ritual-section">
        <div class="auth-card auth-card--form">
            <p class="eyebrow">Change password</p>
            <h2 id="account-heading">Change password</h2>
            <form method="post" novalidate class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="auth-button" type="submit">
                    <span>Update Password</span><span aria-hidden="true">→</span>
                </button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
