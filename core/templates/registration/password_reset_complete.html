{% extends "base.html" %}

{% block title %}Password reset complete - BeyondScreen{% endblock %}

{% block content %}
<main>
    <section class="hero-shell">
        <div class="hero-grid">
            <div class="hero-copy reveal">
                <p class="eyebrow">Password reset</p>
                <h1>Password reset complete</h1>
                <p class="hero-lede">Your password has been set. You may go ahead and log in now.</p>
            </div>
        </div>
    </section>

    <section class="ritual-section" style="padding: 2rem 0; max-width: 400px; margin: 0 auto;">
        <div style="text-align: center;">
            <a href="{% url 'core:login' %}" class="primary-button">
                <span>Log in</span><span aria-hidden="true">→</span>
            </a>
        </div>
    </section>
</main>
{% endblock %}
